
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudVault | Secure File Storage</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; color: #eaf0ff;
      background: linear-gradient(135deg, #10172a, #192d4b);
      min-height: 100vh; padding: 32px 16px;
    }
    main { max-width: 760px; margin: auto; }
    header { text-align: center; margin-bottom: 28px; }
    .logo { font-size: 42px; }
    h1 { margin: 8px 0; font-size: 34px; }
    header p { color: #b8c6df; }
    .panel {
      background: #ffffff0d; border: 1px solid #ffffff20;
      border-radius: 18px; padding: 24px; margin: 18px 0;
    }
    h2 { margin-top: 0; font-size: 20px; }
    input[type=file] { width: 100%; margin: 12px 0; }
    button {
      background: #76a9ff; color: #10172a; border: 0;
      border-radius: 9px; padding: 11px 16px;
      font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .secondary { background: #2a3c58; color: white; }
    #status { white-space: pre-wrap; color: #b8d4ff; margin-top: 14px; }
    .file {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 0; border-bottom: 1px solid #ffffff20;
      overflow-wrap: anywhere;
    }
    .file:last-child { border-bottom: 0; }
    .muted { color: #b8c6df; font-size: 14px; }
    @media(max-width: 480px) {
      .file { align-items: flex-start; flex-direction: column; }
      h1 { font-size: 28px; }
    }


.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin: 16px 0 24px;
}

.stat-card {
  background: #f5f7fb;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 18px;
  min-width: 0;
}

.stat-card p {
  margin: 0 0 10px;
  color: #64748b;
  font-size: 14px;
}

.stat-card h3 {
  margin: 0;
  color: #172554;
  font-size: 26px;
  overflow-wrap: anywhere;
}

@media (max-width: 480px) {
  .stats-grid {
    grid-template-columns: 1fr;
  }
}

    
.file-controls {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0;
}

.file-controls input,
.file-controls select {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid #dbe2ea;
  border-radius: 10px;
  background: #ffffff;
  color: #172554;
  font: inherit;
  box-sizing: border-box;
}

.file-controls input:focus,
.file-controls select:focus {
  outline: 2px solid #93c5fd;
  outline-offset: 2px;
}

@media (max-width: 600px) {
  .file-controls {
    grid-template-columns: 1fr;
  }
}

#progressContainer {
  margin-top: 16px;
}

#progressText {
  margin-bottom: 8px;
}

#uploadProgress {
  display: block;
  accent-color: #76a9ff;
  border-radius: 10px;
  overflow: hidden;
}

#uploadProgress:indeterminate {
  opacity: 0.7;
}

    
  </style>
</head>
<body>
<main>
  <header>
    <div class="logo">☁️</div>
    <h1>CloudVault</h1>
    <p>Your simple cloud file storage</p>
  </header>

  <section class="panel">
    <h2>Upload a file</h2>
    <p class="muted">Choose a file up to 4 MB.</p>
    
<input id="fileInput" type="file" aria-describedby="uploadHelp">
<p id="uploadHelp" class="muted">
  Maximum file size: 4 MB. Choose a file to upload.
</p>

<button id="uploadBtn" onclick="uploadFile()">Upload file</button>

<div id="progressContainer" hidden>
  <p id="progressText" class="muted" role="status">
    Preparing upload...
  </p>
  <progress id="uploadProgress" value="0" max="100"
    style="width:100%; height:18px;"></progress>
</div>

<div id="status" role="status" aria-live="polite"></div>

  </section>

  
<section class="panel">
    <h2>Storage Dashboard</h2>

    <div class="stats-grid">
      <div class="stat-card">
        <p>Total Files</p>
        <h3 id="totalFiles">0</h3>
      </div>

      <div class="stat-card">
        <p>Storage Used</p>
        <h3 id="totalStorage">0 Bytes</h3>
      </div>

      <div class="stat-card">
        <p>Text Files</p>
        <h3 id="textFiles">0</h3>
      </div>

      <div class="stat-card">
        <p>Images</p>
        <h3 id="imageFiles">0</h3>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Your files</h2>


<div class="file-controls">
  <input
    type="text"
    id="searchFiles"
    placeholder="Search files by name..."
    aria-label="Search files by name"
  />

  <select id="filterType" aria-label="Filter files by type">
    <option value="all">All file types</option>
    <option value="text">Text files</option>
    <option value="image">Images</option>
    <option value="pdf">PDF files</option>
    <option value="other">Other files</option>
  </select>

  <select id="sortFiles" aria-label="Sort files">
    <option value="name-asc">Name: A–Z</option>
    <option value="name-desc">Name: Z–A</option>
    <option value="size-asc">Size: Smallest first</option>
    <option value="size-desc">Size: Largest first</option>
    <option value="newest">Newest first</option>
  </select>
</div>

    
    <button class="secondary" onclick="loadFiles()">Refresh files</button>
    <div id="fileList" style="margin-top:16px">Loading files...</div>
  </section>
</main>

<script>
const API = "https://2spu0z92p7.execute-api.us-east-1.amazonaws.com";



async function loadFiles() {
  const list = document.getElementById("fileList");
  list.textContent = "Loading...";

  try {
    const response = await fetch(API + "/files");
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Could not load files");
    }

    const files = data.files || [];

    // Keep the dashboard statistics based on ALL files
    const totalStorage = files.reduce(
      (sum, file) => sum + (Number(file.size) || 0),
      0
    );

    const getName = file =>
      file.filename || file.name || file.key || "File";

    const getType = file => {
      const name = getName(file).toLowerCase();

      if (/\.(txt|md|csv|json|log|html|css|js|py|xml|yaml|yml)$/i.test(name)) {
        return "text";
      }
      if (/\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i.test(name)) {
        return "image";
      }
      if (/\.pdf$/i.test(name)) {
        return "pdf";
      }
      return "other";
    };

    document.getElementById("totalFiles").textContent = files.length;
    document.getElementById("totalStorage").textContent =
      formatStorage(totalStorage);
    document.getElementById("textFiles").textContent =
      files.filter(file => getType(file) === "text").length;
    document.getElementById("imageFiles").textContent =
      files.filter(file => getType(file) === "image").length;

    // Save the latest file list for frontend-only searching and sorting
    window.cloudVaultFiles = files;

    renderFiles();
  } catch (error) {
    list.textContent = "Could not load files: " + error.message;
  }
}

function renderFiles() {
  const list = document.getElementById("fileList");
  const files = window.cloudVaultFiles || [];

  const search = document.getElementById("searchFiles").value
    .trim()
    .toLowerCase();

  const filter = document.getElementById("filterType").value;
  const sort = document.getElementById("sortFiles").value;

  const getName = file =>
    file.filename || file.name || file.key || "File";

  const getType = file => {
    const name = getName(file).toLowerCase();

    if (/\.(txt|md|csv|json|log|html|css|js|py|xml|yaml|yml)$/i.test(name)) {
      return "text";
    }
    if (/\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i.test(name)) {
      return "image";
    }
    if (/\.pdf$/i.test(name)) {
      return "pdf";
    }
    return "other";
  };

  const filtered = files.filter(file => {
    const matchesSearch = getName(file).toLowerCase().includes(search);
    const matchesType = filter === "all" || getType(file) === filter;
    return matchesSearch && matchesType;
  });

  filtered.sort((a, b) => {
    if (sort === "name-asc") {
      return getName(a).localeCompare(getName(b));
    }
    if (sort === "name-desc") {
      return getName(b).localeCompare(getName(a));
    }
    if (sort === "size-asc") {
      return (Number(a.size) || 0) - (Number(b.size) || 0);
    }
    if (sort === "size-desc") {
      return (Number(b.size) || 0) - (Number(a.size) || 0);
    }
    if (sort === "newest") {
      const dateA = new Date(a.lastModified || a.last_modified || a.uploadedAt || 0).getTime() || 0;
      const dateB = new Date(b.lastModified || b.last_modified || b.uploadedAt || 0).getTime() || 0;
      return dateB - dateA;
    }
    return 0;
  });

  list.replaceChildren();

  if (filtered.length === 0) {
    list.textContent = files.length
      ? "No files match your search or filter."
      : "No files yet. Upload your first file!";
    return;
  }

  filtered.forEach(file => {
    const row = document.createElement("div");
    row.className = "file";

    const name = document.createElement("span");
    name.textContent = getName(file);

    const button = document.createElement("button");
    button.textContent = "Download";
    button.onclick = () => downloadFile(file.key || file.filename || file.name);

    row.append(name, button);
    list.appendChild(row);
  });
}


function formatStorage(bytes) {
  if (bytes < 1024) return bytes + " Bytes";
  if (bytes < 1024 * 1024) {
    return (bytes / 1024).toFixed(2) + " KB";
  }
  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}



async function uploadFile() {
  const fileInput = document.getElementById("fileInput");
  const uploadBtn = document.getElementById("uploadBtn");
  const status = document.getElementById("status");
  const progressContainer = document.getElementById("progressContainer");
  const progressText = document.getElementById("progressText");
  const uploadProgress = document.getElementById("uploadProgress");

  const file = fileInput.files[0];
  const MAX_SIZE = 4 * 1024 * 1024; // 4 MB

  // Clear the previous message.
  status.textContent = "";

  // Validate file selection.
  if (!file) {
    status.textContent = "Please choose a file first.";
    return;
  }

  // Validate file size before reading or uploading.
  if (file.size > MAX_SIZE) {
    status.textContent = "File is too large. The maximum size is 4 MB.";
    return;
  }

  // Validate the filename without changing it.
  const filename = file.name.trim();

  if (
    !filename ||
    /[/\\\u0000-\u001F\u007F]/.test(filename)
  ) {
    status.textContent = "Please choose a file with a valid filename.";
    return;
  }

  uploadBtn.disabled = true;
  fileInput.disabled = true;
  progressContainer.hidden = false;
  uploadProgress.value = 0;
  progressText.textContent = "Preparing upload...";

  try {
    // Convert the file to Base64, as required by the existing Lambda.
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        const dataUrl = reader.result;

        if (typeof dataUrl !== "string" || !dataUrl.includes(",")) {
          reject(new Error("Could not read the selected file."));
          return;
        }

        resolve(dataUrl.split(",")[1]);
      };

      reader.onerror = () => {
        reject(new Error("Could not read the selected file."));
      };

      reader.onabort = () => {
        reject(new Error("File reading was cancelled."));
      };

      reader.readAsDataURL(file);
    });

    progressText.textContent = "Uploading...";

    // XMLHttpRequest lets us display upload progress.
    const result = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();

      xhr.open("POST", API + "/upload");
      xhr.setRequestHeader("Content-Type", "application/json");

      xhr.upload.onprogress = (event) => {
        if (event.lengthComputable && event.total > 0) {
          const percent = Math.round(
            (event.loaded / event.total) * 100
          );

          uploadProgress.value = percent;
          progressText.textContent = `Uploading... ${percent}%`;
        } else {
          progressText.textContent = "Uploading...";
        }
      };

      xhr.onload = () => {
        let response;

        try {
          response = JSON.parse(xhr.responseText);
        } catch {
          reject(new Error("The server returned an unreadable response."));
          return;
        }

        if (xhr.status < 200 || xhr.status >= 300) {
          reject(
            new Error(
              response.error ||
              response.message ||
              `Upload failed (HTTP ${xhr.status}).`
            )
          );
          return;
        }

        if (response.error) {
          reject(new Error(response.error));
          return;
        }

        resolve(response);
      };

      xhr.onerror = () => {
        reject(
          new Error("Network error. Check your connection and try again.")
        );
      };

      xhr.onabort = () => {
        reject(new Error("The upload was cancelled."));
      };

      xhr.send(JSON.stringify({
        filename: filename,
        contentType: file.type || "application/octet-stream",
        fileBase64: base64
      }));
    });

    uploadProgress.value = 100;
    progressText.textContent = "Upload complete — 100%";
    status.textContent = "File uploaded successfully.";

    fileInput.value = "";

    // Refresh the existing dashboard file list and statistics.
    await loadFiles();

  } catch (error) {
    progressText.textContent = "Upload failed.";
    status.textContent = error.message || "Upload failed. Please try again.";
  } finally {
    uploadBtn.disabled = false;
    fileInput.disabled = false;
  }
}


async function downloadFile(key) {
  if (!key) {
    alert("The file key is missing. Check the Lambda /files response.");
    return;
  }
  try {
    const response = await fetch(API + "/download?key=" + encodeURIComponent(key));
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Download failed");

    const url = result.url || result.downloadUrl || result.download_url;
    if (!url) throw new Error("The API did not return a download URL.");
    window.open(url, "_blank", "noopener");
  } catch (error) {
    alert("Download failed: " + error.message);
  }
}

document.getElementById("searchFiles").addEventListener("input", renderFiles);
document.getElementById("filterType").addEventListener("change", renderFiles);
document.getElementById("sortFiles").addEventListener("change", renderFiles);

loadFiles();
</script>
</body>
</html>
